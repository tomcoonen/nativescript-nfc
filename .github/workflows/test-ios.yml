name: Unit tests (iOS simulator)

on:
  workflow_dispatch:

jobs:
  test:
    name: ns test ios --emulator
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NativeScript CLI
        run: npm install -g nativescript

      - name: Build plugin
        run: npm install --no-audit --no-fund

      - name: Install demo dependencies
        working-directory: demo
        run: npm install --no-audit --no-fund

      - name: Boot iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8')).devices;
            for (const runtime of Object.keys(d)) {
              if (!runtime.includes('iOS')) continue;
              const dev = d[runtime].find(x => x.name.startsWith('iPhone'));
              if (dev) { console.log(dev.udid); break; }
            }
          ")
          echo "Booting $DEVICE"
          xcrun simctl boot "$DEVICE" || true

      - name: Run unit tests
        working-directory: demo
        run: ns test ios --emulator --justlaunch
